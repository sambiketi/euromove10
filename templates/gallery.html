{% extends "base.html" %}

{% block title %}Gallery - Euromove{% endblock %}

{% block content %}
<section style="margin: 2rem 0;">
    <h1 style="color: var(--dark-green); border-left: 4px solid var(--green); padding-left: 15px;">Our Gallery</h1>
    <p style="color: var(--text-light); text-align: center; max-width: 600px; margin: 1rem auto;">
        Explore photos from our workshops, events, and success stories.
    </p>
    
    <div class="gallery-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; margin-top: 2rem;">
        <!-- Sample gallery images - you can replace these with dynamic images from your database -->
        <div class="gallery-item" style="background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(141, 110, 99, 0.1);">
            <img src="https://via.placeholder.com/300x200?text=Workshop+1" alt="Workshop Session" style="width: 100%; height: 200px; object-fit: cover;">
            <div style="padding: 1rem;">
                <p style="margin: 0; color: var(--text-dark); font-weight: 500;">Workshop Session</p>
            </div>
        </div>
        
        <div class="gallery-item" style="background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(141, 110, 99, 0.1);">
            <img src="https://via.placeholder.com/300x200?text=Success+Story" alt="Success Story" style="width: 100%; height: 200px; object-fit: cover;">
            <div style="padding: 1rem;">
                <p style="margin: 0; color: var(--text-dark); font-weight: 500;">Success Story</p>
            </div>
        </div>
        
        <div class="gallery-item" style="background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(141, 110, 99, 0.1);">
            <img src="https://via.placeholder.com/300x200?text=Event+2024" alt="2024 Event" style="width: 100%; height: 200px; object-fit: cover;">
            <div style="padding: 1rem;">
                <p style="margin: 0; color: var(--text-dark); font-weight: 500;">2024 Event</p>
            </div>
        </div>
        
        <div class="gallery-item" style="background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(141, 110, 99, 0.1);">
            <img src="https://via.placeholder.com/300x200?text=Team" alt="Our Team" style="width: 100%; height: 200px; object-fit: cover;">
            <div style="padding: 1rem;">
                <p style="margin: 0; color: var(--text-dark); font-weight: 500;">Our Team</p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
